<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed59e"/>
      <stop offset="50%" stop-color="#d5aa6d"/>
      <stop offset="100%" stop-color="#af8242"/>
    </linearGradient>
  </defs>

  <!-- Monogram Mark Container -->
  <g transform="translate(6, 6)">
    <!-- Base Shape -->
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#141f32" stroke="url(#goldGradWhite)" stroke-width="1.8"/>
    
    <!-- Outer "C" Arc -->
    <path d="M 34 14 C 29 10 19 11 14 17 C 8 23 8 33 14 39 C 20 44 29 45 34 41" 
          fill="none" 
          stroke="url(#goldGradWhite)" 
          stroke-width="3.6" 
          stroke-linecap="round"/>

    <!-- Central "I" Pillar -->
    <line x1="25" y1="19" x2="25" y2="39" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Apex Diamond -->
    <polygon points="25,9 28,13 25,17 22,13" fill="url(#goldGradWhite)"/>
  </g>

  <!-- Typography Lockup -->
  <!-- Brand Name -->
  <text x="68" y="32" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" letter-spacing="0.12em" fill="#ffffff">
    IMMACULATE
  </text>
  
  <!-- Subtitle -->
  <text x="69" y="47" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.28em" fill="#d5aa6d">
    STRATEGIC CONSULTANCY
  </text>
</svg>
