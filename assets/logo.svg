<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 60" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLawH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed59e"/>
      <stop offset="50%" stop-color="#d5aa6d"/>
      <stop offset="100%" stop-color="#b08343"/>
    </linearGradient>
  </defs>

  <!-- Law & Justice Mark -->
  <g transform="translate(6, 6)">
    <!-- Base Shape -->
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#0e1726" stroke="url(#goldLawH)" stroke-width="1.8"/>

    <!-- Apex Diamond -->
    <polygon points="24,7 26.5,10 24,13 21.5,10" fill="url(#goldLawH)"/>

    <!-- Crossbeam -->
    <path d="M 11 16 L 24 15 L 37 16" fill="none" stroke="url(#goldLawH)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Central Pillar ("I") -->
    <line x1="24" y1="13" x2="24" y2="38" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Pedestal Base -->
    <line x1="18" y1="38" x2="30" y2="38" stroke="url(#goldLawH)" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="41" x2="33" y2="41" stroke="url(#goldLawH)" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Left Pan -->
    <line x1="12" y1="17" x2="8" y2="26" stroke="url(#goldLawH)" stroke-width="1"/>
    <line x1="12" y1="17" x2="16" y2="26" stroke="url(#goldLawH)" stroke-width="1"/>
    <path d="M 7 26 C 7 30 17 30 17 26 Z" fill="url(#goldLawH)"/>

    <!-- Right Pan -->
    <line x1="36" y1="17" x2="32" y2="26" stroke="url(#goldLawH)" stroke-width="1"/>
    <line x1="36" y1="17" x2="40" y2="26" stroke="url(#goldLawH)" stroke-width="1"/>
    <path d="M 31 26 C 31 30 41 30 41 26 Z" fill="url(#goldLawH)"/>
  </g>

  <!-- Typography Lockup -->
  <!-- Brand Name -->
  <text x="68" y="32" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" letter-spacing="0.12em" fill="#0e1726">
    IMMACULATE
  </text>
  
  <!-- Subtitle -->
  <text x="69" y="47" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.28em" fill="#d5aa6d">
    LEGAL &amp; STRATEGIC CONSULTANCY
  </text>
</svg>
