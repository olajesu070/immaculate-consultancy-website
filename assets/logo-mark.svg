<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c58b"/>
      <stop offset="50%" stop-color="#d5aa6d"/>
      <stop offset="100%" stop-color="#b38749"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142138"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
  </defs>

  <!-- Background Emblem Base -->
  <rect x="4" y="4" width="92" height="92" rx="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Geometric Interlocking "I" and "C" Monogram -->
  <!-- Outer Arch "C" -->
  <path d="M 68 28 C 58 20 40 22 29 33 C 18 44 18 64 29 75 C 40 86 58 88 68 80" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linecap="round"/>

  <!-- Central Strategic Pillar "I" -->
  <path d="M 50 38 L 50 78" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round"/>

  <!-- Compass Apex Diamond at Top -->
  <polygon points="50,18 56,26 50,34 44,26" fill="url(#goldGrad)"/>

  <!-- Precision Accent Dot -->
  <circle cx="72" cy="74" r="3.5" fill="url(#goldGrad)"/>
</svg>
